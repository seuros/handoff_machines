[package]
name = "handoff-machines"
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Bounded partition ownership transfer phases with generation-tagged acknowledgements and fenced activation"
readme = "README.md"
exclude = ["src/**/tests.rs", "src/tests/", "tests/"]
keywords = ["handoff", "partition", "rebalance", "fencing", "no-std"]
categories = ["no-std", "algorithms"]

[dependencies]
lease-machines.workspace = true
offset-machines.workspace = true
periscope-machines.workspace = true

[dev-dependencies]
matryona-machines = { workspace = true, features = ["testing"] }

[lints]
workspace = true
