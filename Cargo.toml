[workspace]
members = ["ext/handoff_machines_native/core", "ext/handoff_machines_native/ffi"]
default-members = ["ext/handoff_machines_native/core"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
handoff-machines = { path = "ext/handoff_machines_native/core" }
magnus = { version = "0.9.3", default-features = false, features = ["rb-sys"] }
rb-sys = { version = "0.9.130", default-features = false, features = ["stable-api-compiled-fallback"] }
lease-machines = ">=0.5"
offset-machines = ">=0.4"
periscope-machines = ">=0.4"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
